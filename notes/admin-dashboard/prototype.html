/* Layout: OceanECO's "Instrument" theme (dark only, graphite + one ochre accent, 2px radius).

:root {
  color-scheme: dark;
  --bg: #0d0f11; --bg-muted: #13161a; --bg-elev: #191d22; --bg-acc: #20252b;
  --border: #262b31; --border-muted: #1e2227; --border-acc: #3a4048;
  --dim: #5f6871; --muted: #7d868f; --toned: #a7afb7; --text: #d4d9de;
  --accent: #e2a336; --accent-ink: #22160a; --accent-soft: #3a260c;
  --sensor: #5fb3d6;
  --ok: #7fbf8e; --lag: #d6c35e; --stale: #e0904f; --bad: #e07a7a; --none: #5f6871;
  --font: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --r: 2px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--bg-muted); border-right: 1px solid var(--border-muted); padding-block: 16px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-weight: 600; letter-spacing: .01em; }
.brand span { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; justify-content: space-between; align-items: center; padding: 7px 8px; border-radius: var(--r); color: var(--toned); text-decoration: none; }
.nav a:hover { background: var(--bg-elev); color: var(--text); }
.nav a.on { background: var(--bg-elev); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.nav .count { font: 11px var(--mono); color: var(--muted); }
.nav .count.alert { color: var(--bad); }
.rail .foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 8px; display: flex; flex-direction: column; gap: 6px; }
main { padding-block: 20px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; min-width: 0; max-width: 1280px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: .07em; color: var(--toned); }
.sub { color: var(--muted); font-size: 13px; max-width: 70ch; margin: 4px 0 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--mono); padding: 2px 7px; border: 1px solid var(--border-acc); border-radius: var(--r); color: var(--toned); white-space: nowrap; }
.chip.ex { border-style: dashed; color: var(--muted); }
.panel { background: var(--bg-muted); border: 1px solid var(--border-muted); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font: 500 26px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.stat .n { font-size: 12px; color: var(--toned); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.s-live { background: var(--ok); } .s-lag { background: var(--lag); } .s-stale { background: var(--stale); } .s-silent { background: var(--bad); } .s-none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--none); }

.btn { border: 1px solid var(--border-acc); background: var(--bg-elev); padding: 5px 10px; border-radius: var(--r); cursor: pointer; white-space: nowrap; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.danger { color: var(--bad); border-color: #5a2f2f; background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--toned); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; color: var(--toned); display: inline-flex; gap: 6px; align-items: center; font-size: 13px; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }

.seg .c { font: 11px var(--mono); color: var(--muted); }
input[type=search], input[type=text], input[type=date], select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 5px 8px; min-width: 0; }
input[type=search] { width: 220px; max-width: 100%; }
.tablewrap { overflow-x: auto; border: 1px solid var(--border-muted); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; background: var(--bg-muted); border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; }
td { padding: 7px 10px; border-bottom: 1px solid var(--border-muted); vertical-align: middle; }
tr.row { cursor: pointer; } tr.row:hover td { background: var(--bg-muted); }
tr.sel td { background: var(--bg-elev); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12px; }
.name { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: var(--muted); }
.vars { display: flex; gap: 3px; flex-wrap: wrap; }
.v { font: 10px var(--mono); padding: 1px 4px; border-radius: var(--r); background: var(--bg-acc); color: var(--toned); }
.status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; }
.tog { position: relative; width: 30px; height: 16px; border-radius: 8px; background: var(--bg-acc); border: 1px solid var(--border-acc); cursor: pointer; flex: none; padding: 0; }
.tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: transform .12s; }
.tog[aria-checked=true] { background: var(--accent-soft); border-color: var(--accent); }
.tog[aria-checked=true]::after { transform: translateX(14px); background: var(--accent); }
.tog:disabled { opacity: .35; cursor: not-allowed; }
.tog.changed { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--sensor); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--bg-elev); border-left: 1px solid var(--border-acc); padding-block: max(16px, env(safe-area-inset-top, 0px)) 16px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); overflow-y: auto; display: flex; flex-direction: column; gap: 16px; z-index: 20; box-shadow: -12px 0 32px rgba(0,0,0,.35); }
.drawer header { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.drawer h3 { margin: 0; font-size: 15px; font-weight: 600; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { color: var(--text); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.cov { display: flex; flex-direction: column; gap: 5px; }
.cov div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px; color: var(--toned); }
.cov i { display: block; height: 8px; background: var(--bg); border-radius: 1px; position: relative; }
.cov i b { position: absolute; top: 0; bottom: 0; background: var(--sensor); border-radius: 1px; }
.mgrid { display: grid; gap: 2px; font-size: 11px; }
.mgrid .lab { color: var(--toned); white-space: nowrap; padding-right: 8px; display: flex; align-items: center; }
.mgrid .day { font: 10px var(--mono); color: var(--muted); text-align: center; }
.cell { height: 22px; border-radius: 1px; border: 0; padding: 0; cursor: pointer; }
.cell.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.st-sync { background: #3f6b4a; } .st-ingest { background: #5d8f68; } .st-image { background: #7fae7f; }
.st-compute, .st-download { background: #4a5560; }
.st-failed { background: var(--bad); } .st-pending { background: transparent; box-shadow: inset 0 0 0 1px var(--border-acc); }
.st-na { background: var(--bg); }
.bar { display: grid; grid-template-columns: 200px minmax(0, 1fr) 90px auto; gap: 10px; align-items: center; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--border-muted); }
.bar:first-of-type { border-top: 0; }
.bar i { display: block; height: 10px; background: var(--bg); border-radius: 1px; }
.bar i b { display: block; height: 100%; background: var(--toned); border-radius: 1px; }
.bar.left i b { background: var(--stale); }

.confirm { border: 1px solid #5a2f2f; background: #1c1214; padding: 12px; border-radius: var(--r); display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.lockbox { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--border); border-radius: var(--r); font-size: 12px; color: var(--toned); }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal form { background: var(--bg-elev); border: 1px solid var(--border-acc); border-radius: var(--r); padding: 18px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; }

  const full = { ph: 'pH (total)', DO: 'Dissolved oxygen', T: 'Temperature', S: 'Salinity', chl: 'Chlorophyll a', 'Ωar': 'Ω aragonite', 'Ωca': 'Ω calcite', pCO2: 'pCO₂' };
  return `<header><div><h3>${esc(s.name)}</h3><p class="sub"><span class="status"><i class="dot ${STCLS[s.st]}"></i>${ST[s.st][0]}</span> · last value ${age(s.h)} ago</p></div><button class="btn ghost" data-act="close" aria-label="Close">✕</button></header>
  <div class="actions"><button class="btn primary" data-act="toast" data-msg="Would start ${s.api === 'ONC' ? 'OceanECO-sensors-ONC' : 'OceanECO-sensors-ERDDAP'} for this sensor only">Harvest now</button><button class="btn" data-act="toast" data-msg="Would ask for a start date, then re-harvest from it">Backfill from…</button><button class="btn" data-safe data-act="toast" data-msg="Would open the app with this sensor selected">Open in app</button></div>
  <section class="cov"><h2>Record, 2005 → today</h2>${s.t0 ? s.vars.map(v => `<div><span>${full[v] || v}</span><i><b style="${span(s.t0, s.last)}"></b></i></div>`).join('') : '<p class="muted">No values ingested yet.</p>'}</section>
  <section style="display:flex;flex-direction:column;gap:10px"><h2>Details</h2>
    <label class="field">Display name<input type="text" id="f-name" value="${esc(s.name)}"></label>
    <div class="grid g2"><label class="field">Organization<input type="text" id="f-org" value="${esc(s.org)}"></label><label class="field">Nominal depth (m)<input type="text" id="f-depth" value="${s.depth < 0 ? '' : s.depth}" placeholder="profiler"></label></div>
    <label class="field">Note shown in the app<textarea id="f-note" rows="2" placeholder="e.g. Instrument recovered for servicing until spring"></textarea></label>
    <div class="actions"><button class="btn" data-act="save-meta" data-id="${s.id}">Stage changes</button></div>
  </section>
  <section style="display:flex;flex-direction:column;gap:8px"><h2>Variable mapping</h2>
    <div class="tablewrap"><table><thead><tr><th>App variable</th><th>Source name</th><th>Unit</th><th class="num">× factor</th></tr></thead><tbody>
    ${s.org === 'ONC' && s.vars.includes('DO') ? '<tr><td>dissolved_oxygen</td><td class="mono">oxygen_corrected</td><td>ml/L</td><td class="num">44.66</td></tr><tr><td>salinity</td><td class="mono">salinity</td><td>PSU</td><td class="num">1</td></tr><tr><td>temperature</td><td class="mono">temperature</td><td>°C</td><td class="num">1</td></tr>' : '<tr><td colspan="4" class="muted">Read from <span class="mono">sensors.variables</span>; editable here.</td></tr>'}
    </tbody></table></div><p class="note">Unit fixes (like the 12 ERDDAP oxygen sensors stored unconverted) would be made here, with a re-harvest to apply them.</p>
  </section>
  <section class="kv"><dt>Source</dt><dd class="mono">${s.api}${s.org === 'ONC' ? ' · locationCode' : ' · tabledap'}</dd><dt>First value</dt><dd>${s.t0 || '—'}</dd><dt>Last value</dt><dd>${s.t ? s.t.replace('T', ' ') + ' UTC' : '—'}</dd></section>
  <section class="confirm"><b>Delete this sensor's data</b><span class="muted">Removes its rows from sensor_timeseries. The sensor entry stays, hidden.</span><div class="actions"><button class="btn danger" data-act="toast" data-msg="Would ask you to type the sensor name first">Delete data…</button></div></section>`;
}

function modelView() {
  const cols = `120px repeat(${DAYS.length}, minmax(14px, 1fr))`;
  let g = `<div class="mgrid" style="grid-template-columns:${cols}"><span></span>${DAYS.map((d, i) => `<span class="day">${i % 7 === 0 || i === DAYS.length - 1 ? fmtDay(d) : ''}</span>`).join('')}`;
  for (const v of MVARS) {
    g += `<span class="lab">${v.replace(/_/g, ' ')}</span>` + DAYS.map((d, i) => { const m = mstate(v, d); const id = v + '|' + i; return `<button class="cell st-${m.st} ${selCell === id ? 'sel' : ''}" data-cell="${id}" aria-label="${v} ${fmtDay(d)}: ${m.label}" title="${v} · ${fmtDay(d)} · ${m.label}"></button>`; }).join('');
  }
  g += '</div>';
  let side = '<p class="muted">Select a day to see its steps, attempts and errors.</p>';
  if (selCell) {
    const [v, i] = selCell.split('|'); const d = DAYS[+i]; const m = mstate(v, d);
    const ymd = d.toISOString().slice(0, 10).replace(/-/g, '');
    side = `<h2>${v.replace(/_/g, ' ')} · ${fmtDay(d)} 2026</h2><dl class="kv"><dt>Status</dt><dd class="mono">${m.label}</dd><dt>Attempts</dt><dd>${m.attempts}</dd><dt>File</dt><dd class="mono">/nc/${v}/${v}_${ymd}.nc</dd>${m.err ? `<dt>Error</dt><dd style="color:var(--bad)">${m.err}</dd>` : ''}</dl>
    <div class="actions">${m.st === 'failed' ? `<button class="btn primary" data-act="stage" data-label="Retry ${v} ${fmtDay(d)} from ${m.label.replace('failed_', '')}">Retry from ${m.label.replace('failed_', '')}</button>` : ''}<button class="btn" data-act="stage" data-label="Rebuild map tiles: ${v} ${fmtDay(d)}">Rebuild map tiles</button><button class="btn" data-act="stage" data-label="Rerun all steps: ${v} ${fmtDay(d)}">Rerun all steps</button></div>`;
  }
  return `<div class="head"><div><h1>Model runs <span class="chip">SalishSeaCast</span></h1><p class="sub">One cell per variable per day, coloured by the furthest step it reached. Each step is a row in <span class="mono">SalishSeaCast_status</span>.</p></div><span class="chip ex">example states; dev only tracks temperature and oxygen</span></div>
  <div class="grid g4">
    <div class="panel stat"><span class="k">Daily table</span><span class="v">2007 → 15 Nov</span><span class="n">8 variables</span></div>
    <div class="panel stat"><span class="k">Hourly window</span><span class="v">92 days</span><span class="n">older hours are dropped</span></div>
    <div class="panel stat"><span class="k">Failed days</span><span class="v" style="color:var(--bad)">1</span><span class="n">16 Nov · 4 variables</span></div>
    <div class="panel stat"><span class="k">Next scheduled run</span><span class="v">15:00</span><span class="n">every 3 hours</span></div>
  </div>
  <section class="panel"><div style="overflow-x:auto">${g}</div>
    <div class="legend"><span><i class="dot st-sync"></i>Synced to prod</span><span><i class="dot st-ingest"></i>In ClickHouse</span><span><i class="dot st-image"></i>Map tiles made</span><span><i class="dot st-failed"></i>Failed</span><span><i class="dot st-pending"></i>Waiting</span><span><i class="dot st-na"></i>Not on ERDDAP yet</span></div></section>
  <div class="grid g2">
    <section class="panel">${side}</section>
    <section class="panel"><h2>Reprocess a range</h2>
      <div class="grid g2"><label class="field">From<input type="date" id="r-from" value="2026-11-10"></label><label class="field">To<input type="date" id="r-to" value="2026-11-16"></label></div>
      <label class="field">Starting step<select id="r-step"><option>download</option><option>compute</option><option selected>image</option><option>ingest</option><option>sync</option></select></label>
      <label class="field">Variables<select id="r-vars"><option>All 8</option><option>Carbonate only (pH, Ω)</option><option>One variable…</option></select></label>
      <p class="note">Waits for a running scheduled run to finish; never runs alongside one.</p>
      <div class="actions"><button class="btn" data-act="stage-range">Stage reprocess</button></div></section>
  </div>`;
}

function jobsView() {
  return `<div class="head"><div><h1>Scheduled jobs</h1><p class="sub">Our three Prefect deployments on pipelines.cioospacific.ca. Run history and logs stay in Prefect; this page starts, pauses and summarizes.</p></div><span class="chip ex">run results are examples</span></div>
  <section class="panel"><div class="list">${JOBS.map(j => `<div><p><b>${j.name}</b><small>${j.what}</small><small class="mono">${j.cron} · ${j.every} · next ${j.next}</small></p>
    <div class="actions" style="align-items:center"><span class="status"><i class="dot ${j.last[0] === 'ok' ? 's-live' : 's-silent'}"></i>${j.last[1]} <span class="muted">${j.last[2]}</span></span>
    <button class="btn" data-act="toast" data-msg="Would start a run of ${j.name} now">Run now</button><button class="btn" data-act="stage" data-label="Pause schedule: ${j.name}">Pause</button><button class="btn ghost" data-safe data-act="toast" data-msg="Would open this deployment in Prefect">Prefect ↗</button></div></div>`).join('')}</div></section>
  <section class="panel"><h2>Harvest one sensor</h2><div class="toolbar"><select id="one-sensor" aria-label="Sensor">${S.slice(0, 20).map(s => `<option>${esc(s.name)}</option>`).join('')}</select><button class="btn" data-act="toast" data-msg="Would run the matching flow with sensor_id set">Run</button></div><p class="note">Both sensor flows already accept a <span class="mono">sensor_id</span> parameter, so this needs no pipeline change.</p></section>`;
}

function storageView() {
  const max = Math.max(...TABLES.map(t => t[2]));
  const group = g => TABLES.filter(t => t[0] === g).map(t => `<div class="bar ${g === 'Leftover' ? 'left' : ''}"><span class="mono">${t[1]}</span><i><b style="width:${Math.max(.4, Math.sqrt(t[2] / max) * 100)}%"></b></i><span class="num">${fmtSize(t[2])}</span><span class="muted" style="font-size:12px">${t[3]}</span></div>`).join('');
  return `<div class="head"><div><h1>Storage</h1><p class="sub">ClickHouse tables by size (bar length is square-root scaled so small tables stay visible), plus the caches the app keeps.</p></div></div>
  <section class="panel"><h2>Model</h2>${group('Model')}</section>
  <section class="panel"><h2>Observations</h2>${group('Observations')}</section>
  <section class="panel"><div class="head"><h2>Not used by the app</h2><button class="btn danger" data-act="drop">Drop these tables…</button></div>${group('Leftover')}
    ${confirmDrop ? `<div class="confirm"><b>Drop 7 tables, 15.9 GiB</b><span>This can't be undone. Type <span class="mono">drop liveocean</span> to confirm.</span><div class="toolbar"><input type="text" id="drop-confirm" aria-label="Type drop liveocean"><button class="btn danger" data-act="drop-go">Drop</button><button class="btn ghost" data-act="drop-cancel">Cancel</button></div></div>` : ''}</section>
  <section class="panel"><h2>Caches and files</h2><div class="list">
    <div><p>API response cache<small>Cached JSON for timeseries, profiles and snapshots.</small></p><button class="btn" data-act="toast" data-msg="Would clear the API response cache">Clear</button></div>
    <div><p>Map tiles on disk <span class="chip ex">needs an endpoint</span><small>SalishSeaCast/images and seafloor tiles; sizes read by the API.</small></p><button class="btn" disabled>Clear</button></div>
    <div><p>Grid cache<small>cache/oa_grid_cache.npz, rebuilt from grid_SSC on first use.</small></p><button class="btn" data-act="toast" data-msg="Would delete the grid cache file">Rebuild</button></div>
  </div></section>`;
}

function appView() {
  return `<div class="head"><div><h1>App controls</h1><p class="sub">Settings the public app reads at load time, so a change needs no deploy.</p></div></div>
  <section class="panel"><h2>Notice banner</h2>
    <label class="field">Message<input type="text" id="b-msg" value="Model maps for 16 Nov are delayed while SalishSeaCast's server recovers."></label>
    <div class="toolbar"><select id="b-level" aria-label="Banner level"><option>Info</option><option selected>Warning</option></select><select id="b-until" aria-label="Show until"><option>Until I turn it off</option><option selected>For 24 hours</option></select><button class="btn" data-act="stage" data-label="Publish notice banner">Stage</button></div></section>
  <section class="panel"><h2>Features</h2><div class="list">${FLAGS.map(([id, l, d, on]) => `<div><p>${l}<small>${d}</small></p><button class="tog" role="switch" aria-checked="${on}" aria-label="${l}" data-flag="${id}"></button></div>`).join('')}</div></section>
  <section class="panel"><h2>Sensor freshness thresholds</h2><div class="grid g4">
    <label class="field">Live, under<input type="text" id="th-live" value="24 h"></label><label class="field">Lagging, under<input type="text" id="th-lag" value="7 days"></label><label class="field">Stale, under<input type="text" id="th-stale" value="90 days"></label><label class="field">Email me when a sensor turns<select id="th-mail"><option>Stale</option><option selected>Silent</option><option>Never</option></select></label></div></section>
  `;
}

function backupsView() {
  const restore = restoreFrom == null ? '' : (() => {
    const later = SNAPS.slice(0, restoreFrom).flatMap(s => s[3]);
    return `<div class="confirm" style="border-color:var(--border-acc);background:var(--bg-elev)"><b>Restore the ${SNAPS[restoreFrom][0]} snapshot</b>
      <span>${later.length ? `Reverts ${later.length} change${later.length > 1 ? 's' : ''} made since then:` : 'Nothing has changed since then.'}</span>
      ${later.length ? `<ul style="padding-left:18px">${later.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
      <span class="muted">A snapshot of the current state is taken first, so the restore itself can be undone.</span>
      <div class="actions">${later.length ? `<button class="btn primary" data-act="stage" data-label="Restore snapshot ${SNAPS[restoreFrom][0]}">Stage restore</button>` : ''}<button class="btn ghost" data-act="restore-cancel">Cancel</button></div></div>`;
  })();
  return `<div class="head"><div><h1>Backups</h1><p class="sub">Snapshots of everything this dashboard controls, so any earlier state can be compared and restored.</p></div><span class="chip ex">snapshots are examples</span></div>
  <div class="grid g2">
    <section class="panel"><h2>What a snapshot holds</h2><div class="list">
      <div><p>Sensors<small>On map, auto-harvest, names, organizations, depths, notes, variable mappings: all 652 entries.</small></p><span class="chip">~140 KB</span></div>
      <div><p>App controls<small>Notice banner, features, freshness thresholds, email alerts.</small></p><span class="chip">&lt; 1 KB</span></div>
      <div><p>Job schedules<small>Paused or running, for each of the three Prefect deployments.</small></p><span class="chip">&lt; 1 KB</span></div>
    </div><p class="note">Measurements and model output are left out: sensors can be re-harvested and model days reprocessed. The audit log is kept in full rather than snapshotted.</p></section>
    <section class="panel"><h2>Schedule</h2>
      <label class="field">Take a snapshot<select id="bk-every"><option selected>Every 6 hours</option><option>Daily, at 00:00 UTC</option></select></label>
      <label class="field">Keep<select id="bk-keep"><option selected>6-hourly for 7 days, then daily for 90 days</option><option>Daily for 30 days</option></select></label>
      <label class="field">Also copy to<select id="bk-copy"><option selected>S3 bucket (survives losing the database)</option><option>Nowhere else</option></select></label>
      <p class="note">A snapshot is also taken before every restore and before any bulk change of more than 10 sensors.</p>
      <div class="actions"><button class="btn" data-act="toast" data-msg="Would take a snapshot now">Snapshot now</button></div></section>
  </div>
  <section class="panel"><h2>Snapshots</h2>${restore}
    <div class="tablewrap"><table><thead><tr><th>Taken (UTC)</th><th>Trigger</th><th class="num">Changes since previous</th><th></th></tr></thead><tbody>${SNAPS.map((s, i) => `<tr><td class="mono">${s[0]}</td><td>${s[1]}</td><td class="num">${s[2] || '—'}</td><td style="text-align:right"><button class="btn" data-safe data-act="toast" data-msg="Would download this snapshot as JSON">Download</button> <button class="btn" data-act="restore" data-i="${i}" ${i === 0 ? 'disabled title="This is the current state"' : ''}>Restore…</button></td></tr>`).join('')}</tbody></table></div></section>`;
}

function auditView() {
  return `<div class="head"><div><h1>Audit log</h1><p class="sub">Every change made from this dashboard, with the value before and after. Applied changes from this prototype appear here too.</p></div><span class="chip ex">first 4 rows are examples</span></div>
  <p class="note">Undo reverts that one change; to go back further, restore a snapshot under Backups.</p>
  <div class="tablewrap"><table><thead><tr><th>When (UTC)</th><th>Area</th><th>Change</th><th>Detail</th><th></th></tr></thead><tbody>${AUDIT.map(a => `<tr><td class="mono">${a[0]}</td><td><span class="chip">${a[2]}</span></td><td>${esc(a[3])}</td><td class="muted mono">${esc(a[4])}</td><td><button class="btn ghost" data-act="stage" data-label="Undo: ${esc(a[3])}">Undo</button></td></tr>`).join('')}</tbody></table></div>`;
}

function renderPending() {
  const el = $('#pending');
  el.hidden = pending.size === 0;
  if (!pending.size) return;
  el.innerHTML = `<b>${pending.size} staged change${pending.size > 1 ? 's' : ''}</b><ul>${[...pending.values()].slice(0, 4).map(p => `<li class="chip">${esc(p)}</li>`).join('')}${pending.size > 4 ? `<li class="chip">+${pending.size - 4} more</li>` : ''}</ul><button class="btn ghost" data-act="discard">Discard</button><button class="btn primary" data-act="apply">Apply ${pending.size}</button>`;
  applyLock();
}

function render() {
  renderNav();
  $('#main').innerHTML = (unlocked() ? '' : `<div class="locknote"><span>Read-only. Nothing on this page can be changed until you unlock editing.</span><button class="btn" data-act="unlock">Unlock…</button></div>`)
    + { overview, sensors: sensorsView, model: modelView, jobs: jobsView, storage: storageView, 'app-controls': appView, audit: auditView, backups: backupsView }[view]();
  const d = $('#drawer');
  d.hidden = !(view === 'sensors' && selSensor != null);
  if (!d.hidden) d.innerHTML = sensorDrawer(S[selSensor]);
  renderPending();
}

function route() {
  const h = location.hash.slice(1);
  view = VIEWS.some(v => v[0] === h) ? h : 'overview';
  if (view !== 'sensors') selSensor = null;
  render(); window.scrollTo(0, 0);
}
addEventListener('hashchange', route);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tog],[data-filter],[data-sensor],[data-cell],[data-act],[data-flag]');
  if (!t) return;
  if (isMut(t)) {
    if (!unlocked()) { e.stopPropagation(); return askUnlock(); }
    unlockedUntil = Date.now() + LOCK_MS;
  }
  const act = t.dataset.act;
  if (act === 'add-open') { add = { type: 'erddap', src: '', filter: '', looked: false, map: true, harvest: true, from: 'all' }; renderAdd(); $('#adddlg').hidden = false; return $('#add-src').focus(); }
  if (act === 'add-cancel') { $('#adddlg').hidden = true; return; }
  if (act === 'add-type') { add.type = t.dataset.type; add.src = ''; add.filter = ''; return renderAdd(); }
  if (act === 'add-lookup') {
    add.src = $('#add-src').value.trim(); add.filter = $('#add-filter')?.value.trim() || '';
    if (!add.src) { $('#add-err').hidden = false; return; }
    add.looked = true; return renderAdd();
  }
  if (act === 'add-back') { add.looked = false; return renderAdd(); }
  if (act === 'add-map' || act === 'add-harvest') {
    // update in place so typed details and variable choices survive
    if (act === 'add-map') { add.map = !add.map; if (!add.map) add.harvest = false; } else add.harvest = !add.harvest;
    const h = $('[data-act="add-harvest"]');
    $('[data-act="add-map"]').setAttribute('aria-checked', add.map);
    h.setAttribute('aria-checked', add.map && add.harvest); h.disabled = !add.map;
    return;
  }
  if (act === 'add-stage') {
    const name = $('#add-name').value.trim() || LOOKUP[add.type].title;
    pending.set('new:' + name, `Add sensor: ${name}${add.map ? '' : ' (hidden)'}${add.map && add.harvest ? '' : ', no auto-harvest'}`);
    $('#adddlg').hidden = true; renderPending(); return toast('Staged new sensor');
  }
  if (t.dataset.act === 'unlock') return askUnlock();
  if (t.dataset.act === 'unlock-cancel') { $('#lockdlg').hidden = true; return; }
  if (t.dataset.act === 'lock') { unlockedUntil = 0; restoreFrom = null; confirmDrop = false; render(); return toast(pending.size ? 'Locked. Staged changes are kept; unlock to apply them.' : 'Locked'); }
  if (t.dataset.tog != null) {
    e.stopPropagation();
    const s = S[+t.dataset.tog], key = t.dataset.key, k = s.id + ':' + key;
    s[key] = !s[key];
    if (pending.has(k)) pending.delete(k); else pending.set(k, `${key === 'map' ? (s.map ? 'Show' : 'Hide') : (s.harvest ? 'Start auto-harvest' : 'Stop auto-harvest')}: ${s.name}`);
    // hidden ⇒ not harvested; showing again leaves auto-harvest off until turned on
    if (key === 'map' && !s.map && s.harvest) { s.harvest = false; const hk = s.id + ':harvest'; if (pending.has(hk)) pending.delete(hk); else pending.set(hk, 'Stop auto-harvest: ' + s.name); }
    return render();
  }
  if (t.dataset.flag) { const on = t.getAttribute('aria-checked') !== 'true'; t.setAttribute('aria-checked', on); FLAGS.find(x => x[0] === t.dataset.flag)[3] = on; const k = 'flag:' + t.dataset.flag; if (pending.has(k)) pending.delete(k); else pending.set(k, `${on ? 'Turn on' : 'Turn off'}: ${t.getAttribute('aria-label')}`); return renderPending(); }
  if (t.dataset.filter) { filter = t.dataset.filter; selSensor = null; if (t.tagName === 'A') return; return render(); }
  if (t.dataset.sensor) { selSensor = +t.dataset.sensor; return render(); }
  if (t.dataset.cell) { selCell = t.dataset.cell; return render(); }
  const a = t.dataset.act;
  if (a === 'toast') toast(t.dataset.msg + ' (prototype)');
  if (a === 'close') { selSensor = null; render(); }
  if (a === 'stage') { pending.set('x:' + t.dataset.label, t.dataset.label); renderPending(); toast('Staged'); }
  if (a === 'stage-range') { const l = `Reprocess ${$('#r-from').value} → ${$('#r-to').value} from ${$('#r-step').value}, ${$('#r-vars').value}`; pending.set('x:' + l, l); renderPending(); toast('Staged'); }
  if (a === 'save-meta') { const s = S[+t.dataset.id]; pending.set('meta:' + s.id, 'Edit details: ' + $('#f-name').value); renderPending(); toast('Staged'); }
  if (a === 'bulk-harvest') {
    S.filter(s => s.st === filter && s.harvest).forEach(s => { s.harvest = false; pending.set(s.id + ':harvest', 'Stop auto-harvest: ' + s.name); });
    render();
  }
  if (a === 'harvest-one') { const s = S[+t.dataset.id]; toast(`Would run ${s.api === 'ONC' ? 'OceanECO-sensors-ONC' : 'OceanECO-sensors-ERDDAP'} for “${s.name}” only (prototype)`); }
  if (a === 'restore') { restoreFrom = +t.dataset.i; render(); }
  if (a === 'restore-cancel') { restoreFrom = null; render(); }
  if (a === 'discard') {
    for (const k of pending.keys()) {
      const m = k.match(/^(\d+):(map|harvest)$/); if (m) S[+m[1]][m[2]] = !S[+m[1]][m[2]];
      const f = k.startsWith('flag:') && FLAGS.find(x => x[0] === k.slice(5)); if (f) f[3] = !f[3];
    }
    pending.clear(); restoreFrom = null; render(); toast('Discarded staged changes');
  }
  if (a === 'apply') {
    const now = '19 Nov ' + new Date().toISOString().slice(11, 16);
    [...pending.values()].reverse().forEach(p => AUDIT.unshift([now, 'you', p.split(':')[0].includes('arvest') || p.startsWith('Add sensor') || p.startsWith('Show') || p.startsWith('Hide') || p.startsWith('Edit') ? 'Sensor' : p.startsWith('Turn') || p.startsWith('Publish') ? 'App' : p.startsWith('Restore') ? 'Backup' : p.startsWith('Undo') ? 'Undo' : 'Model', p, 'prototype: nothing was changed']));
    pending.clear(); toast('Applied and logged (prototype: nothing was changed)'); render();
  }
  if (a === 'drop') { confirmDrop = true; render(); }
  if (a === 'drop-cancel') { confirmDrop = false; render(); }
  if (a === 'drop-go') { if ($('#drop-confirm').value.trim() === 'drop liveocean') { confirmDrop = false; toast('Would drop 7 tables (prototype)'); render(); } else toast('Type “drop liveocean” exactly'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { q = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#q'); el.focus(); el.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => { if (e.target.id === 'org') { org = e.target.value; render(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#lockdlg').hidden) { $('#lockdlg').hidden = true; return; }
  if (!$('#adddlg').hidden) { $('#adddlg').hidden = true; return; }
  if (selSensor != null) { selSensor = null; render(); }
});
$('#add-form').addEventListener('submit', e => { e.preventDefault(); if (!add.looked) $('[data-act="add-lookup"]').click(); });
$('#unlock-form').addEventListener('submit', e => {
  e.preventDefault();
  // prototype: any non-empty password unlocks; the real check happens on the server
  if (!$('#unlock-pw').value) { $('#unlock-err').hidden = false; return; }
  $('#unlock-pw').value = ''; $('#lockdlg').hidden = true;
  unlockedUntil = Date.now() + LOCK_MS; render(); toast('Editing unlocked for 15 minutes');
});
route();
</script>
